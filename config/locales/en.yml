# Rubylode Projects: the English strings, under one root. Redmine's own strings are used where it has one (Members, Subprojects, Summary, Gantt).
en:
  rubylode_projects:
    open_issues: Open issues
    closed_issues: Closed
    all_issues: All issues
    done: Done
    closed_share: "%{percentage}% of all issues"
    this_project_only: In this project only
    across_subprojects:
      one: Across 1 subproject
      other: Across %{count} subprojects
    closed_of_total: "%{closed} of %{total} closed"
    weekly_chart_title: Opened vs closed per week
    weekly_chart_description: Bar chart of the issues opened and closed in each of the last %{count} weeks
    weekly_chart_note_with_subprojects: This project's issues, subprojects included, by the week they were opened or closed.
    weekly_chart_note_project_only: This project's issues, by the week they were opened or closed.
    opened: Opened
    closed: Closed
    week: Week
    week_of: Week of %{date}
    bar_title_opened: 'Week of %{date}: %{count} opened'
    bar_title_closed: 'Week of %{date}: %{count} closed'
    by_tracker: By tracker
    open_and_closed_html: "%{open} open · %{closed} closed"
    done_of_total: "%{percentage}% done of %{total}"
    in_progress_and_urgent: In progress and urgent
    all_open_by_priority: All open issues →
    nothing_urgent: Nothing is in progress or urgent.
    classic_overview: Classic overview
    card_overview: Back to the new overview
    week_range: "%{first} to %{last}"
    week_summary: "%{label}: %{opened} opened, %{closed} closed, net %{net}, %{open_total} open at the end"
    see_all: See all %{count}
    tips:
      open: Open
      opened: Opened
      closed: Closed
      net: Net change
      open_total: Open at the end of the week
      top_trackers: Most opened
      opened_link: Issues opened this week
      closed_link: Issues closed this week
      overdue: Overdue
      done: Done
      no_issues: No issues
      busiest_open: "%{count} open"
      quiet_since: Last activity %{ago} ago
      quiet_never: No activity yet
      open_issues: Open issues
      closed_week: Closed in the last 7 days
      no_projects: No projects
    series_toggle: Show or hide %{series}
    net_change: Net change
    open_at_end: Open at the end
    week_issue_lists: Issue lists
    settings:
      show_on_heading: Show the block on
      default_display:
        label: Default projects display
        hint: What /projects shows when the address names no display and no saved query. ?display_type=board always shows the board.
        choices:
          list: List
          board: Board
          redmine: Leave to Redmine
      show_summary:
        label: Show the summary and charts above the list
      added_columns:
        label: Columns added to the project list
        hint: Added to Redmine's default columns when the list names none of its own. Every column can also be picked in the list options.
      add_columns_to_saved_queries:
        label: Also add them to saved queries
        hint: Shows the ticked columns on a saved project query that holds none of this plugin's columns. The query itself is not changed, so turning this off brings back what was saved.
      trend_weeks:
        label: Weeks in the trend
        hint: From %{first} to %{last}. The portfolio chart and the sparklines cover this many weeks.
      show_on_welcome_page:
        label: Welcome page
        hint: Adds the projects table to Redmine's home page, after the welcome text or the news.
      welcome_page_column:
        label: Column
        hint: Left or right.
        choices:
          left: Left
          right: Right
      maximum_rows:
        label: Maximum rows
        hint: At most this many rows are listed in the projects table, from %{first} to %{last}. The macro and the partial use it when they name no limit.
      projects_table_show_description:
        label: Show the description in the projects table
      projects_table_show_done_bar:
        label: Show the done bar in the projects table
    errors:
      default_display: Default projects display must be List, Board or Leave to Redmine.
      trend_weeks: Weeks in the trend must be a whole number from %{first} to %{last}.
      columns: 'Unknown columns: %{names}.'
      welcome_page_column: Welcome page column must be Left or Right.
      maximum_rows: Maximum rows must be a whole number from %{first} to %{last}.
    columns:
      open_issues: Open issues
      overdue: Overdue
      closed_week: Closed (last 7 days)
      percent_done: "% done"
      trend: Trend
      last_activity: Last activity
    trend_label: 'Closed per week over the last %{count} weeks, oldest first: %{values}'
    summary_label: Summary of the projects in this list
    tiles:
      projects: Projects
      open: Open issues
      closed_week: Closed this week
      overdue: Overdue
      due_soon: Due in 7 days
      unassigned: Unassigned
      quiet: Quiet 30+ days
    tile_notes:
      projects: in this list
      open: of %{total} issues
      closed_week: since Monday
      overdue: past their due date
      due_soon: open, due today or within 7 days
      unassigned: open, with no assignee
      quiet: projects with no activity
    portfolio_chart_note: The issues of the projects in this list, by the week they were opened or closed.
    link_not_limited_note: The list has more than %{count} projects, so the links list the issues of every project you can see, not only these.
    where_the_work_is: Where the work is
    where_the_work_is_note: Open issues per top-level project, subprojects included. The %{count} busiest.
    no_open_issues: No open issues.
    trend_table_caption: Issues closed and opened per week, for each project in the list
    trend_cell: "%{closed} closed, %{opened} opened"
    table_open_link: "%{project}: %{count} open issues"
    table_closed_link: "%{project}: %{count} closed issues"
    macro_errors:
      unknown_argument: projects_table takes title, limit and subprojects, not "%{name}"
      bad_limit: limit must be a whole number from %{first} to %{last}
      bad_subprojects: subprojects must be true or false
