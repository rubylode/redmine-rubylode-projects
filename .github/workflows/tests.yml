name: tests

# Runs the plugin's integration tests inside a real Redmine, the same steps as bin/test:
# Redmine's source, the plugin in plugins/redmine_rubylode_projects, SQLite, then the plugin's test task.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Redmine ${{ matrix.redmine }}, Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { redmine: "7.0.2", ruby: "3.4" }
          - { redmine: "7.0.2", ruby: "4.0" }
          - { redmine: "7.0-stable", ruby: "3.4" }
          - { redmine: "7.0-stable", ruby: "4.0" }
          - { redmine: "6.1-stable", ruby: "3.4" }
          - { redmine: "6.0-stable", ruby: "3.3" }
    env:
      RAILS_ENV: test
      BUNDLE_WITHOUT: development
    steps:
      - uses: actions/checkout@v7
        with:
          repository: redmine/redmine
          github-server-url: https://github.com
          ref: ${{ matrix.redmine }}
          path: redmine

      - uses: actions/checkout@v7
        with:
          path: redmine/plugins/redmine_rubylode_projects

      # Redmine's Gemfile picks the database gem from this file, so it has to exist before the gems are installed.
      - name: Write the database settings
        run: |
          printf 'test:\n  adapter: sqlite3\n  database: db/test.sqlite3\n' > redmine/config/database.yml

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: redmine

      - name: Create the database and the plugin's table
        working-directory: redmine
        run: bundle exec rake generate_secret_token db:migrate redmine:plugins:migrate

      - name: Run the plugin's tests
        working-directory: redmine
        run: bundle exec rake redmine:plugins:test:integration NAME=redmine_rubylode_projects

  # A zip of what a release would contain, for a quick look at a change on main; the release workflow builds the real one.
  package:
    name: Build the plugin zip
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the zip
        run: git archive --format=zip --prefix=redmine_rubylode_projects/ -o redmine_rubylode_projects.zip HEAD

      - uses: actions/upload-artifact@v7
        with:
          name: redmine_rubylode_projects
          path: redmine_rubylode_projects.zip
          retention-days: 14
